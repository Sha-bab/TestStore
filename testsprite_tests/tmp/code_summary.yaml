version: "2"
type: frontend
tech_stack:
  - PHP 8.x
  - MySQL (PDO)
  - Bootstrap / MDB UI Kit 7.3.2
  - Vanilla JavaScript
  - Material Icons
  - Google Fonts (Poppins)
  - Chart.js 4.4.3

routes:
  - path: /Test%20Store/index.php
    file: index.php
    auth_required: false
    description: Home page with featured, newest, and top-rated apps
  - path: /Test%20Store/search.php
    file: search.php
    auth_required: false
    description: Search and browse all apps with filters
  - path: /Test%20Store/category.php
    file: category.php
    auth_required: false
    description: Apps filtered by category
  - path: /Test%20Store/app.php
    file: app.php
    auth_required: false
    description: App detail page with download, reviews, and screenshots
  - path: /Test%20Store/review.php
    file: review.php
    auth_required: false
    description: All reviews for a specific app with pagination
  - path: /Test%20Store/download.php
    file: download.php
    auth_required: false
    description: APK file download handler (streams APK binary)
  - path: /Test%20Store/auth/login.php
    file: auth/login.php
    auth_required: false
    description: Unified login page for users and developers
  - path: /Test%20Store/auth/register.php
    file: auth/register.php
    auth_required: false
    description: Registration page for users and developers
  - path: /Test%20Store/auth/logout.php
    file: auth/logout.php
    auth_required: true
    description: Logout handler that clears session and redirects to login
  - path: /Test%20Store/developer/dashboard.php
    file: developer/dashboard.php
    auth_required: true
    description: Developer dashboard with stats, recent apps, and activity feed
  - path: /Test%20Store/developer/publish.php
    file: developer/publish.php
    auth_required: true
    description: Publish a new APK app with icon and screenshots
  - path: /Test%20Store/developer/edit-app.php
    file: developer/edit-app.php
    auth_required: true
    description: Edit an existing app's metadata and files
  - path: /Test%20Store/developer/my-apps.php
    file: developer/my-apps.php
    auth_required: true
    description: List of developer's own apps with status filters
  - path: /Test%20Store/developer/analytics.php
    file: developer/analytics.php
    auth_required: true
    description: Downloads and rating charts plus per-app stats
  - path: /Test%20Store/developer/profile.php
    file: developer/profile.php
    auth_required: true
    description: Developer profile editing with photo upload and password change
  - path: /Test%20Store/admin/login.php
    file: admin/login.php
    auth_required: false
    description: Admin-only login page
  - path: /Test%20Store/admin/dashboard.php
    file: admin/dashboard.php
    auth_required: true
    description: Admin dashboard with platform stats and pending approvals
  - path: /Test%20Store/admin/app-approval.php
    file: admin/app-approval.php
    auth_required: true
    description: Review and approve or reject pending app submissions
  - path: /Test%20Store/admin/apps.php
    file: admin/apps.php
    auth_required: true
    description: Browse and manage all apps in the store
  - path: /Test%20Store/admin/developers.php
    file: admin/developers.php
    auth_required: true
    description: List and manage developers (block/unblock/delete)
  - path: /Test%20Store/admin/settings.php
    file: admin/settings.php
    auth_required: true
    description: Edit site-wide settings like site name, allow_registration, etc.

features:
  - name: User Registration
    description: Register as a regular user or developer with email, username, and password
    files:
      - auth/register.php
      - includes/auth.php
      - includes/db.php
    entry_route: /Test%20Store/auth/register.php
    user_interactions:
      - Switch between User and Developer tabs
      - Fill username, email, password, confirm password fields
      - For developer, select developer type, country, mobile
      - Click Create Account button
      - See validation errors on invalid input
      - Redirected to home or developer dashboard on success
    api_calls: []
    auth_required: false

  - name: User Login
    description: Login as user, developer, or admin with email and password
    files:
      - auth/login.php
      - includes/auth.php
    entry_route: /Test%20Store/auth/login.php
    user_interactions:
      - Switch between User and Developer tabs
      - Fill email and password
      - Click Sign In button
      - Toggle password visibility with eye icon
      - See error on invalid credentials
      - Redirected to home or developer dashboard on success
    api_calls: []
    auth_required: false

  - name: Admin Login
    description: Admin-specific login with role=admin check
    files:
      - admin/login.php
      - includes/auth.php
    entry_route: /Test%20Store/admin/login.php
    user_interactions:
      - Fill admin email (admin@teststore.com) and password (admin123)
      - Click Admin Sign In button
      - See error on invalid credentials
      - Redirected to admin dashboard on success
    api_calls: []
    auth_required: false

  - name: App Discovery Home
    description: Browse featured, newest, and top-rated apps on the homepage
    files:
      - index.php
      - includes/card.php
    entry_route: /Test%20Store/index.php
    user_interactions:
      - View hero stats (total apps, developers, downloads)
      - Search from hero search bar
      - Click category pills to filter by category
      - View Most Downloaded apps grid
      - View Newest Apps grid
      - View Top Rated apps grid
      - Click app card to view app detail
    api_calls: []
    auth_required: false

  - name: App Search & Filter
    description: Search apps by keyword, filter by category and type, sort results
    files:
      - search.php
      - includes/card.php
    entry_route: /Test%20Store/search.php
    user_interactions:
      - Enter search query in sidebar search box
      - Click Sort By options (Most Downloaded, Newest First, Top Rated, Name A-Z)
      - Filter by Free or Paid app type
      - Filter by category from sidebar list
      - Navigate pagination
    api_calls: []
    auth_required: false

  - name: App Detail Page
    description: View full app info, screenshots, version history, reviews, and download button
    files:
      - app.php
      - includes/card.php
    entry_route: /Test%20Store/app.php?id=1
    user_interactions:
      - View app icon, name, developer, rating, downloads, size
      - Click Download APK button
      - View screenshots gallery
      - Switch between Description, Version History, Release Notes tabs
      - View reviews and submit a review (when logged in as user)
      - Select star rating by clicking stars
      - View similar apps in sidebar
    api_calls: []
    auth_required: false

  - name: Publish App
    description: Developer submits a new app for review with APK, icon, screenshots
    files:
      - developer/publish.php
    entry_route: /Test%20Store/developer/publish.php
    user_interactions:
      - Fill app name, package name, category, type, version
      - Fill short and full description, keywords, release notes
      - Select min Android version, target SDK, content rating
      - Optionally add privacy policy and terms URLs, promo video URL
      - Upload APK file (.apk, max 100MB)
      - Upload app icon (PNG/JPG/WEBP, max 2MB) with preview
      - Upload up to 5 screenshots
      - Click Submit for Review
      - See validation errors on invalid input
    api_calls: []
    auth_required: true

  - name: Developer Analytics
    description: View download trends and rating distribution charts
    files:
      - developer/analytics.php
    entry_route: /Test%20Store/developer/analytics.php
    user_interactions:
      - View daily downloads line chart (last 30 days)
      - View rating distribution doughnut chart
      - View per-app breakdown table
    api_calls: []
    auth_required: true

  - name: Admin App Approvals
    description: Admin reviews pending app submissions and approves or rejects them
    files:
      - admin/app-approval.php
    entry_route: /Test%20Store/admin/app-approval.php
    user_interactions:
      - View list of pending apps in left panel
      - Click a pending app to see details (icon, description, screenshots, tech info)
      - Click Approve to approve app (sets status to approved)
      - Enter rejection reason and click Reject to reject app
    api_calls: []
    auth_required: true

  - name: Admin Developer Management
    description: Admin can view, block, unblock, and delete developers
    files:
      - admin/developers.php
    entry_route: /Test%20Store/admin/developers.php
    user_interactions:
      - Search developers by name or email
      - Filter by status (active/blocked) and type (individual/company)
      - Click Block or Unblock to toggle developer status
      - Click delete icon to delete a developer
    api_calls: []
    auth_required: true

known_limitations:
  - issue: No email verification or password reset feature exists
    location: auth/register.php, auth/login.php
    impact: Users cannot reset forgotten passwords
  - issue: Screenshot upload uses file MIME type detection via browser but server only checks extension for APK
    location: developer/publish.php
    impact: Slight inconsistency in validation approach
  - issue: Admin dashboard chart script was previously rendering before Chart.js loaded (now fixed)
    location: admin/dashboard.php
    impact: Fixed - chart now renders correctly
